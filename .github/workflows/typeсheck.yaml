name: typechecking

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Python 3.8 has no build for the newer runners
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pipx install poetry
        python -m venv .venv
        poetry install
    - name: Running mypy
      run: |
        source ./.venv/bin/activate
        mypy cyberiadaml_py
        mypy tests