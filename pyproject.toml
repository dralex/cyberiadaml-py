[tool.poetry]
name = "cyberiadaml-py"
version = "1.8.0"
description = "The Python 3 library for processing the CyberiadaML state machine graphs"
authors = ["L140-beep <kartoshka0302@mail.ru>"]
license = "LGPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10, <4"
pydantic = "^2.6.1"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.1,<10.0.0"
mypy = "^1.8.0"
flake8 = "^7.0.0"
flake8-docstrings = "^1.7.0"
flake8-import-order = "^0.18.2"
flake8-quotes = "^3.4.0"
flake8-pyproject = "^1.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
import-order-style="pep8"
inline-quotes = "single"
ignore=["D107", "W504", "F403", "F401"]
# the cml methods are the binding's, documented in docs/CML.md
per-file-ignores = ["cyberiadaml_py/cml/*.py:D102,D105",
                    "cyberiadaml_py/htgeom/*.py:D102,D103,D105"]
# copies of the libcyberiadamlpp-py tests, kept as they are
exclude = ["tests/cml/binding", ".venv"]

[tool.mypy]
exclude = ["tests/cml/binding/"]
